<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 8: Thấu Kính - Trò Chơi Lật Hình</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Titan+One&family=Nunito:wght@800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1c23;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
    }

    .slide-container {
      width: 900px;
      height: 550px;
      background-color: #ffffff;
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .slide {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    .slide.active {
      display: flex;
    }

    .title-main {
      font-family: 'Titan One', cursive, sans-serif;
      font-size: 52px;
      color: #000000;
      letter-spacing: 2px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .title-sub {
      font-family: 'Titan One', cursive, sans-serif;
      font-size: 42px;
      color: #000000;
      letter-spacing: 1.5px;
      line-height: 1.2;
      margin-bottom: 45px;
      text-transform: uppercase;
    }

    .play-btn {
      width: 170px;
      height: 100px;
      background-color: #6bbd00;
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 15px rgba(107, 189, 0, 0.4);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 38px solid #ffffff;
      margin-left: 8px;
    }

    .play-btn:hover {
      transform: scale(1.15);
      background-color: #79d600;
      box-shadow: 0 0 25px #6bbd00, 0 0 50px #9aff00;
    }

    .grid-title {
      font-size: 28px;
      font-weight: 900;
      color: #333;
      margin-bottom: 20px;
    }

    /* HIỆU ỨNG THẺ BÀI LẬT 3D */
    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 15px;
      width: 100%;
      max-width: 700px;
      perspective: 1000px;
    }

    .card-item {
      height: 100px;
      cursor: pointer;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s;
      transform-style: preserve-3d;
      border-radius: 12px;
    }

    .card-item.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
    }

    .card-front {
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: white;
      font-size: 32px;
      font-weight: 900;
    }

    .card-front:hover {
      background: linear-gradient(135deg, #60a5fa, #2563eb);
    }

    .card-back {
      background-color: #10b981;
      color: white;
      font-size: 16px;
      font-weight: bold;
      transform: rotateY(180deg);
      padding: 5px;
    }

    .back-btn {
      margin-top: 25px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      background-color: #e5e7eb;
      color: #374151;
      border-radius: 8px;
      cursor: pointer;
    }

    .back-btn:hover {
      background-color: #d1d5db;
    }

    /* KHUNG HIỂN THỊ CÂU HỎI KHI BẤM VÀO THẺ */
    .modal-question {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.85);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 100;
    }

    .modal-question.active {
      display: flex;
    }

    .q-title {
      font-size: 24px;
      margin-bottom: 20px;
      color: #facc15;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      width: 80%;
      margin-bottom: 20px;
    }

    .opt-btn {
      padding: 12px;
      background-color: #374151;
      color: white;
      border: 2px solid #4b5563;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .opt-btn:hover {
      background-color: #4b5563;
    }

    .close-q-btn {
      padding: 8px 20px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div class="slide-container">
    <div class="slide active" id="slide1">
      <h1 class="title-main">BÀI 8 : THẤU KÍNH</h1>
      <h2 class="title-sub">TRÒ CHƠI LẬT HÌNH</h2>
      <div class="play-btn" onclick="goToSlide(2)">
        <div class="play-icon"></div>
      </div>
    </div>

    <div class="slide" id="slide2">
      <h3 class="grid-title">CHỌN THẺ CÂU HỎI</h3>
      <div class="card-grid">
        <div class="card-item" onclick="openQuestion(1, this)">
          <div class="card-inner">
            <div class="card-front">1</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(2, this)">
          <div class="card-inner">
            <div class="card-front">2</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(3, this)">
          <div class="card-inner">
            <div class="card-front">3</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(4, this)">
          <div class="card-inner">
            <div class="card-front">4</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(5, this)">
          <div class="card-inner">
            <div class="card-front">5</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(6, this)">
          <div class="card-inner">
            <div class="card-front">6</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(7, this)">
          <div class="card-inner">
            <div class="card-front">7</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(8, this)">
          <div class="card-inner">
            <div class="card-front">8</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(9, this)">
          <div class="card-inner">
            <div class="card-front">9</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(10, this)">
          <div class="card-inner">
            <div class="card-front">10</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
      </div>
      <button class="back-btn" onclick="goToSlide(1)">❮ Quay lại</button>
    </div>

    <!-- KHUNG CÂU HỎI -->
    <div class="modal-question" id="modalQ">
      <h3 class="q-title" id="qText">Câu hỏi...</h3>
      <div class="options-grid">
        <button class="opt-btn" onclick="checkAns(this)">A. Đáp án A</button>
        <button class="opt-btn" onclick="checkAns(this)">B. Đáp án B</button>
        <button class="opt-btn" onclick="checkAns(this)">C. Đáp án C</button>
        <button class="opt-btn" onclick="checkAns(this)">D. Đáp án D</button>
      </div>
      <button class="close-q-btn" onclick="closeQuestion()">Đóng & Quay lại lưới thẻ</button>
    </div>
  </div>

  <script>
    const questions = {
      1: "Câu 1: Thấu kính hội tụ có đặc điểm gì về rìa so với phần giữa?",
      2: "Câu 2: Thấu kính phân kỳ là thấu kính có phần rìa như thế nào?",
      3: "Câu 3: Chùm tia tới song song với trục chính của thấu kính hội tụ cho chùm tia ló thế nào?",
      4: "Câu 4: Quang tâm O của thấu kính có đặc điểm gì khi tia sáng truyền qua?",
      5: "Câu 5: Tiêu điểm F của thấu kính nằm trên đường nào?",
      6: "Câu 6: Kính hiển vi hay kính phóng đại thường dùng loại thấu kính nào?",
      7: "Câu 7: Kính cận thị dành cho người cận thị sử dụng thấu kính gì?",
      8: "Câu 8: Tiêu cự f của thấu kính là khoảng cách từ đâu đến đâu?",
      9: "Câu 9: Tác dụng của thấu kính hội tụ là gì?",
      10: "Câu 10: Ảnh ảo tạo bởi thấu kính hội tụ có đặc điểm gì?"
    };

    let currentCard = null;

    function goToSlide(slideNumber) {
      document.querySelectorAll('.slide').forEach(slide => slide.classList.remove('active'));
      document.getElementById('slide' + slideNumber).classList.add('active');
    }

    function openQuestion(cardNum, cardEl) {
      currentCard = cardEl;
      cardEl.classList.add('flipped');
      document.getElementById('qText').innerText = questions[cardNum] || "Câu hỏi về Thấu kính số " + cardNum;
      document.getElementById('modalQ').classList.add('active');
    }

    function closeQuestion() {
      document.getElementById('modalQ').classList.remove('active');
    }

    function checkAns(btn) {
      alert("Bạn đã chọn: " + btn.innerText);
    }
  </script>

</body>
</html>
