<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 8: Thấu Kính - Trò Chơi Lật Hình</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Bungee&family=Sigmar+One&family=Nunito:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1c23;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
    }

    .slide-container {
      width: 950px;
      height: 600px;
      background-color: #e5c396;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(0,0,0,0.05) 50px),
                        repeating-linear-gradient(90deg, #dfb988, #dfb988 100px, #d6ae7b 100px, #d6ae7b 200px);
      border-radius: 16px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .slide {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
    }

    .slide.active {
      display: flex;
    }

    .title-main {
      font-family: 'Bungee', cursive, sans-serif;
      font-size: 46px;
      color: #000000;
      letter-spacing: 2px;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .title-sub {
      font-family: 'Sigmar One', cursive, sans-serif;
      font-size: 38px;
      color: #000000;
      letter-spacing: 1.5px;
      line-height: 1.3;
      margin-bottom: 45px;
      text-transform: uppercase;
    }

    .play-btn {
      width: 170px;
      height: 100px;
      background-color: #6bbd00;
      border-radius: 30px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 0 15px rgba(107, 189, 0, 0.4);
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 38px solid #ffffff;
      margin-left: 8px;
    }

    .play-btn:hover {
      transform: scale(1.15);
      background-color: #79d600;
      box-shadow: 0 0 25px #6bbd00, 0 0 50px #9aff00;
    }

    .grid-title {
      font-size: 28px;
      font-weight: 900;
      color: #333;
      margin-bottom: 25px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 850px;
      perspective: 1000px;
    }

    /* ĐỊNH DẠNG THẺ & SỬA LỖI HOVER */
    .card-item {
      height: 170px;
      cursor: pointer;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .card-item:hover {
      transform: scale(1.04);
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 14px;
    }

    /* Chỉ xoay khi có class flipped (khi click) */
    .card-item.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
    }

    .card-front {
      font-size: 38px;
      font-weight: 900;
      border: 3px solid rgba(255, 255, 255, 0.4);
      outline: 2px solid transparent;
      outline-offset: -8px;
    }

    .card-front::after {
      content: '';
      position: absolute;
      top: 6px;
      left: 6px;
      right: 6px;
      bottom: 6px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      pointer-events: none;
    }

    /* Màu sắc các thẻ */
    .card-red { background-color: #c93b2b; color: #ffffff; }
    .card-blue { background-color: #2b7bb9; color: #ffffff; }
    .card-green { background-color: #278547; color: #ffffff; }
    .card-yellow { background-color: #f3c623; color: #333333; }
    .card-yellow::after { border-color: rgba(0, 0, 0, 0.2) !important; }
    .card-orange { background-color: #e67e22; color: #ffffff; }
    .card-purple { background-color: #7b3294; color: #ffffff; }
    .card-pink { background-color: #f06292; color: #ffffff; }
    .card-white { background-color: #f5f5f5; color: #333333; border-color: #d1d5db; }
    .card-white::after { border-color: rgba(0, 0, 0, 0.15) !important; }
    .card-dark { background-color: #343a40; color: #ffffff; }
    .card-brown { background-color: #6f4e37; color: #ffffff; }

    .card-back {
      background-color: #10b981;
      color: white;
      font-size: 18px;
      font-weight: 900;
      transform: rotateY(180deg);
      padding: 5px;
      border: 3px solid rgba(255, 255, 255, 0.4);
    }

    .back-btn {
      margin-top: 25px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      background-color: #ffffff;
      color: #374151;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }

    .back-btn:hover {
      background-color: #f3f4f6;
    }

    /* Popup câu hỏi */
    .modal-question {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 100;
    }

    .modal-question.active {
      display: flex;
    }

    .q-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #facc15;
      max-width: 85%;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 85%;
      margin-bottom: 20px;
    }

    .opt-btn {
      padding: 12px 18px;
      background-color: #374151;
      color: white;
      border: 2px solid #4b5563;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .opt-btn:hover {
      background-color: #4b5563;
      border-color: #facc15;
    }

    .close-q-btn {
      padding: 8px 20px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* POPUP THÔNG BÁO BANNER */
    .modal-status {
      display: none;
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .modal-status.active {
      display: flex;
    }

    .status-banner {
      width: 620px;
      height: 190px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
      border-radius: 12px;
      color: #ffffff;
      font-size: 52px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      animation: bannerPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid rgba(255, 255, 255, 0.3);
      text-shadow: 2px 3px 5px rgba(0,0,0,0.3);
      user-select: none;
    }

    .status-banner.success {
      background: linear-gradient(135deg, #70c700 0%, #569e00 100%);
    }

    .status-banner.error {
      background: linear-gradient(135deg, #ff4d4d 0%, #d92626 100%);
    }

    .status-banner svg {
      width: 58px;
      height: 58px;
      fill: #ffffff;
      filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.3));
    }

    @keyframes bannerPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="slide-container">
    <div class="slide active" id="slide1">
      <h1 class="title-main">BÀI 8 : THẤU KÍNH</h1>
      <h2 class="title-sub">TRÒ CHƠI LẬT HÌNH</h2>
      <div class="play-btn" onclick="goToSlide(2)">
        <div class="play-icon"></div>
      </div>
    </div>

    <div class="slide" id="slide2">
      <h3 class="grid-title">CHỌN THẺ CÂU HỎI</h3>
      <div class="card-grid">
        <div class="card-item" onclick="openQuestion(1, this)">
          <div class="card-inner">
            <div class="card-front card-red">1</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(2, this)">
          <div class="card-inner">
            <div class="card-front card-blue">2</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(3, this)">
          <div class="card-inner">
            <div class="card-front card-green">3</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(4, this)">
          <div class="card-inner">
            <div class="card-front card-yellow">4</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(5, this)">
          <div class="card-inner">
            <div class="card-front card-orange">5</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(6, this)">
          <div class="card-inner">
            <div class="card-front card-purple">6</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(7, this)">
          <div class="card-inner">
            <div class="card-front card-pink">7</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(8, this)">
          <div class="card-inner">
            <div class="card-front card-white">8</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(9, this)">
          <div class="card-inner">
            <div class="card-front card-dark">9</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="openQuestion(10, this)">
          <div class="card-inner">
            <div class="card-front card-brown">10</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
      </div>
      <button class="back-btn" onclick="goToSlide(1)">❮ Quay lại</button>
    </div>

    <!-- Modal Câu hỏi -->
    <div class="modal-question" id="modalQ">
      <h3 class="q-title" id="qText">Câu hỏi...</h3>
      <div class="options-grid" id="optionsBox"></div>
      <button class="close-q-btn" onclick="closeQuestion()">Đóng & Quay lại lưới thẻ</button>
    </div>

    <!-- Modal Thông báo Đúng / Sai -->
    <div class="modal-status" id="modalStatus" onclick="closeStatusModal()">
      <div class="status-banner" id="statusBanner">
        <span id="statusIcon"></span>
        <span id="statusText">Trả lời đúng</span>
      </div>
    </div>
  </div>

  <script>
    const questionsData = {
      1: {
        title: "Câu 1: Thấu kính là một khối như thế nào?",
        options: [
          "A. Đục, đồng chất",
          "B. Trong suốt, không đồng chất",
          "C. Trong suốt và đồng chất, giới hạn bởi 2 mặt cong hoặc bởi 1 mặt cong và 1 mặt phẳng",
          "D. Mờ đục và đồng chất, không giới hạn bởi 2 mặt cong hoặc bởi 1 mặt cong và 1 phẳng"
        ],
        correct: 2
      },
      2: {
        title: "Câu 2: Thấu kính có bao nhiêu loại?",
        options: [
          "A. 1",
          "B. 2",
          "C. 3",
          "D. 4"
        ],
        correct: 1
      },
      3: {
        title: "Câu 3: Đâu là phát biểu sai?",
        options: [
          "A. Thấu kính là một khối chất trong suốt, giới hạn bởi hai mặt cong hoặc bởi một mặt cong và một mặt phẳng",
          "B. Thấu kính phân kỳ có phần rìa dày hơn phần ở giữa",
          "C. Thấu kính hội tụ có phần rìa mỏng hơn phần ở giữa",
          "D. Thấu kính hội tụ có phần rìa dày hơn phần ở giữa"
        ],
        correct: 3
      },
      4: {
        title: "Câu 4: Đường thẳng đi qua quang tâm O và vuông góc với tiết diện thẳng của thấu kính gọi là gì?",
        options: [
          "A. Tiêu cự",
          "B. Quang tâm",
          "C. Tiêu điểm chính",
          "D. Trục chính"
        ],
        correct: 3
      },
      5: {
        title: "Câu 5: Có 1 điểm O của thấu kính mà mọi tia sáng tới O đều truyền thẳng qua thấu kính. Điểm O gọi là gì?",
        options: [
          "A. Quang tâm",
          "B. Tiêu điểm chính",
          "C. Trục chính",
          "D. Tiêu cự"
        ],
        correct: 0
      },
      6: {
        title: "Câu 6: Hình 8.4 mô tả hệ thống thấu kính trong ống kính của một máy ảnh. Thấu kính hội tụ trong hệ thống này là:",
        options: [
          "A. Hình 1 và 3",
          "B. Hình 3 và 2",
          "C. Hình 4 và 2",
          "D. Hình 1 và 4"
        ],
        correct: 0
      },
      7: {
        title: "Câu 7: Đâu là phát biểu sai?",
        options: [
          "A. Tia sáng qua quang tâm của thấu kính thì truyền thẳng",
          "B. Tia tới song song với trục chính của thấu kính hội tụ cho tia ló truyền qua tiêu điểm chính của thấu kính",
          "C. Tia tới song song với trục chính của thấu kính phân kì cho tia ló có đường kéo dài qua tiêu điểm chính của thấu kính",
          "D. Tia tới song song với trục chính của thấu kính thì truyền thẳng"
        ],
        correct: 3
      },
      8: {
        title: "Câu 8: Chiếu một chùm tia sáng song song tới thấu kính hội tụ, chùm tia ló thu được là chùm:",
        options: [
          "A. hội tụ",
          "B. song song",
          "C. phân kì",
          "D. sáng hội tụ tại quang tâm của thấu kính"
        ],
        correct: 0
      },
      9: {
        title: "Câu 9: Khoảng cách từ quang tâm O đến tiêu điểm chính F của thấu kính được gọi là gì?",
        options: [
          "A. Trục chính",
          "B. Tiêu cự",
          "C. Độ tụ",
          "D. Tiêu diện"
        ],
        correct: 1
      },
      10: {
        title: "Câu 10: Chiếu một chùm tia sáng song song với trục chính tới thấu kính phân kỳ thì chùm tia ló có đặc điểm gì?",
        options: [
          "A. Hội tụ tại tiêu điểm chính",
          "B. Song song với trục chính",
          "C. Phân kỳ và có đường kéo dài đi qua tiêu điểm chính",
          "D. Truyền thẳng không bị lệch hướng"
        ],
        correct: 2
      }
    };

    function goToSlide(slideNumber) {
      document.querySelectorAll('.slide').forEach(slide => slide.classList.remove('active'));
      document.getElementById('slide' + slideNumber).classList.add('active');
    }

    function openQuestion(cardNum, cardEl) {
      // Chỉ lật thẻ khi được click vào
      if (!cardEl.classList.contains('flipped')) {
        cardEl.classList.add('flipped');
      }
      
      const qData = questionsData[cardNum];
      document.getElementById('qText').innerText = qData.title;
      const optionsBox = document.getElementById('optionsBox');
      optionsBox.innerHTML = '';
      
      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx === qData.correct);
        optionsBox.appendChild(btn);
      });

      document.getElementById('modalQ').classList.add('active');
    }

    function closeQuestion() {
      document.getElementById('modalQ').classList.remove('active');
    }

    function checkAnswer(isCorrect) {
      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');
      const icon = document.getElementById('statusIcon');

      if (isCorrect) {
        banner.className = 'status-banner success';
        text.innerText = 'Trả lời đúng';
        icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg>`;
      } else {
        banner.className = 'status-banner error';
        text.innerText = 'Trả lời sai';
        icon.innerHTML = `<svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>`;
      }

      document.getElementById('modalStatus').classList.add('active');
    }

    function closeStatusModal() {
      document.getElementById('modalStatus').classList.remove('active');
      closeQuestion();
    }
  </script>

</body>
</html>
