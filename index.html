<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bài 8: Thấu Kính - Trò Chơi Lật Hình</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=Nunito:wght@700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: #1a1c23;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Nunito', sans-serif;
      user-select: none;
    }

    /* Container Khung Game */
    .slide-container {
      width: 950px;
      height: 600px;
      background-color: #ffffff;
      border-radius: 20px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
      position: relative;
      overflow: hidden;
    }

    .slide {
      width: 100%;
      height: 100%;
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      text-align: center;
      position: relative;
    }

    .slide.active {
      display: flex;
    }

    /* ================= SẢNH CHÍNH MỚI (SLIDE 1) ================= */
    #slide1 {
      background: radial-gradient(circle at center, #fffbeb 0%, #fef3c7 55%, #fde68a 100%);
      position: relative;
    }

    /* Họa tiết nền sảnh */
    #slide1::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: 
        radial-gradient(#f59e0b 0.8px, transparent 0.8px),
        radial-gradient(#f59e0b 0.8px, #fef3c7 0.8px);
      background-size: 28px 28px;
      background-position: 0 0, 14px 14px;
      opacity: 0.18;
      pointer-events: none;
    }

    /* Vòng tròn quang học chìm giữa sảnh */
    .bg-optics-ring {
      position: absolute;
      width: 480px;
      height: 480px;
      border: 2px dashed rgba(217, 119, 6, 0.2);
      border-radius: 50%;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    /* Bảng tiêu đề chính */
    .lobby-header {
      z-index: 5;
      background: rgba(255, 255, 255, 0.92);
      padding: 25px 50px;
      border-radius: 28px;
      border: 3px solid #f59e0b;
      box-shadow: 0 12px 30px rgba(217, 119, 6, 0.2), inset 0 0 15px rgba(254, 243, 199, 0.5);
      backdrop-filter: blur(8px);
      margin-bottom: 35px;
    }

    .title-main-lobby {
      font-size: 48px;
      font-weight: 900;
      color: #7c2d12;
      letter-spacing: 1px;
      margin-bottom: 4px;
      text-transform: uppercase;
      text-shadow: 2px 2px 0px #fde68a;
    }

    .title-sub-lobby {
      font-size: 42px;
      font-weight: 900;
      color: #d97706;
      line-height: 1.2;
      text-transform: uppercase;
      text-shadow: 1px 1px 0px #ffffff;
    }

    /* Nút Play ở sảnh */
    .play-btn {
      width: 175px;
      height: 95px;
      background: linear-gradient(135deg, #84cc16 0%, #65a30d 100%);
      border-radius: 32px;
      border: 4px solid #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 25px rgba(101, 163, 13, 0.4), inset 0 2px 4px rgba(255, 255, 255, 0.4);
      outline: none;
      z-index: 5;
      animation: btnPulse 2s infinite;
    }

    .play-icon {
      width: 0;
      height: 0;
      border-top: 22px solid transparent;
      border-bottom: 22px solid transparent;
      border-left: 36px solid #ffffff;
      margin-left: 8px;
      filter: drop-shadow(1px 2px 2px rgba(0,0,0,0.2));
    }

    .play-btn:hover {
      transform: scale(1.15) translateY(-3px);
      background: linear-gradient(135deg, #a3e635 0%, #65a30d 100%);
      box-shadow: 0 15px 30px rgba(101, 163, 13, 0.6);
    }

    @keyframes btnPulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.05); }
    }

    /* Đồ họa trang trí sảnh */
    .deco-item {
      position: absolute;
      pointer-events: none;
      z-index: 2;
    }

    /* Thấu kính trái */
    .deco-lens-left {
      left: 35px;
      top: 110px;
      width: 160px;
      height: 220px;
      opacity: 0.9;
    }

    /* Kính phóng đại góc trái dưới */
    .deco-magnifier {
      left: 45px;
      bottom: 35px;
      width: 150px;
      height: 150px;
    }

    /* Bộ thẻ góc phải dưới */
    .deco-cards {
      right: 45px;
      bottom: 35px;
      width: 180px;
      height: 170px;
    }

    /* Thấu kính phải */
    .deco-lens-right {
      right: 40px;
      top: 100px;
      width: 150px;
      height: 200px;
      opacity: 0.9;
    }

    /* Ngôi sao trang trí */
    .deco-star1 { top: 40px; left: 80px; width: 35px; }
    .deco-star2 { top: 50px; right: 90px; width: 45px; }
    .deco-star3 { bottom: 180px; left: 240px; width: 25px; }
    .deco-star4 { bottom: 160px; right: 230px; width: 30px; }

    /* ================= LƯỚI THẺ (SLIDE 2) ================= */
    #slide2 {
      background-color: #e5c396;
      background-image: repeating-linear-gradient(0deg, transparent, transparent 49px, rgba(0,0,0,0.05) 50px),
                        repeating-linear-gradient(90deg, #dfb988, #dfb988 100px, #d6ae7b 100px, #d6ae7b 200px);
    }

    .grid-title {
      font-size: 28px;
      font-weight: 900;
      color: #333;
      margin-bottom: 25px;
      text-shadow: 1px 1px 2px rgba(255,255,255,0.8);
    }

    .card-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 18px;
      width: 100%;
      max-width: 850px;
      perspective: 1000px;
    }

    .card-item {
      height: 170px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      position: relative;
    }

    .card-item:hover {
      transform: scale(1.1);
      z-index: 10;
    }

    .card-inner {
      position: relative;
      width: 100%;
      height: 100%;
      text-align: center;
      transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
      transform-style: preserve-3d;
      border-radius: 14px;
    }

    .card-item.flipped .card-inner {
      transform: rotateY(180deg);
    }

    .card-front, .card-back {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      -webkit-backface-visibility: hidden;
      backface-visibility: hidden;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 6px 12px rgba(0, 0, 0, 0.25);
    }

    .card-front {
      font-size: 38px;
      font-weight: 900;
      border: 3px solid rgba(255, 255, 255, 0.4);
    }

    .card-front::after {
      content: '';
      position: absolute;
      top: 6px; left: 6px; right: 6px; bottom: 6px;
      border: 2px solid rgba(255, 255, 255, 0.35);
      border-radius: 8px;
      pointer-events: none;
    }

    .card-red { background-color: #c93b2b; color: #ffffff; }
    .card-blue { background-color: #2b7bb9; color: #ffffff; }
    .card-green { background-color: #278547; color: #ffffff; }
    .card-yellow { background-color: #f3c623; color: #333333; }
    .card-yellow::after { border-color: rgba(0, 0, 0, 0.2) !important; }
    .card-orange { background-color: #e67e22; color: #ffffff; }
    .card-purple { background-color: #7b3294; color: #ffffff; }
    .card-pink { background-color: #f06292; color: #ffffff; }
    .card-white { background-color: #f5f5f5; color: #333333; border-color: #d1d5db; }
    .card-white::after { border-color: rgba(0, 0, 0, 0.15) !important; }
    .card-dark { background-color: #343a40; color: #ffffff; }
    .card-brown { background-color: #6f4e37; color: #ffffff; }

    .card-back {
      background-color: #10b981;
      color: white;
      font-size: 18px;
      font-weight: 900;
      transform: rotateY(180deg);
      padding: 5px;
      border: 3px solid rgba(255, 255, 255, 0.4);
    }

    .back-btn {
      margin-top: 25px;
      padding: 10px 24px;
      font-size: 16px;
      font-weight: bold;
      border: none;
      background-color: #ffffff;
      color: #374151;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
      transition: background-color 0.2s;
    }

    .back-btn:hover {
      background-color: #f3f4f6;
    }

    /* Modal Hộp thoại Câu Hỏi */
    .modal-question {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.88);
      color: white;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 30px;
      z-index: 100;
    }

    .modal-question.active { display: flex; }

    .q-title {
      font-size: 20px;
      margin-bottom: 20px;
      color: #facc15;
      max-width: 85%;
      line-height: 1.4;
    }

    .options-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      width: 85%;
      margin-bottom: 20px;
    }

    .opt-btn {
      padding: 12px 18px;
      background-color: #374151;
      color: white;
      border: 2px solid #4b5563;
      border-radius: 8px;
      font-size: 15px;
      cursor: pointer;
      text-align: left;
      transition: all 0.2s;
    }

    .opt-btn:hover {
      background-color: #4b5563;
      border-color: #facc15;
    }

    .close-q-btn {
      padding: 8px 20px;
      background-color: #ef4444;
      color: white;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      cursor: pointer;
    }

    /* Modal Banner Thông Báo (Đúng / Sai / Bạn đã trả lời rồi) */
    .modal-status {
      display: none;
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background-color: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(3px);
      z-index: 200;
      justify-content: center;
      align-items: center;
      cursor: pointer;
    }

    .modal-status.active { display: flex; }

    .status-banner {
      width: 650px;
      height: 180px;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 20px;
      border-radius: 16px;
      color: #ffffff;
      font-size: 46px;
      font-weight: 900;
      letter-spacing: 1px;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
      animation: bannerPop 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      border: 4px solid rgba(255, 255, 255, 0.3);
      text-shadow: 2px 3px 5px rgba(0,0,0,0.2);
    }

    .status-banner.success { background: linear-gradient(135deg, #70c700 0%, #569e00 100%); }
    .status-banner.error { background: linear-gradient(135deg, #ff4d4d 0%, #d92626 100%); }
    .status-banner.info {
      background: linear-gradient(135deg, #3b82f6 0%, #1d4ed8 100%);
      font-size: 38px;
    }

    /* Chuẩn hóa kích thước khung chứa icon thông báo */
    .status-icon-box {
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }

    .status-icon-box svg {
      width: 100%;
      height: 100%;
      filter: drop-shadow(2px 3px 3px rgba(0,0,0,0.25));
    }

    @keyframes bannerPop {
      0% { transform: scale(0.5); opacity: 0; }
      100% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <div class="slide-container">
    
    <div class="slide active" id="slide1">
      
      <div class="bg-optics-ring"></div>

      <div class="lobby-header">
        <h1 class="title-main-lobby">BÀI 8 : THẤU KÍNH</h1>
        <h2 class="title-sub-lobby">TRÒ CHƠI LẬT HÌNH</h2>
      </div>
      
      <button class="play-btn" id="btnStartGame" aria-label="Chơi ngay">
        <div class="play-icon"></div>
      </button>

      <svg class="deco-item deco-lens-left" viewBox="0 0 100 150">
        <path d="M0 40 L50 75 L100 40" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
        <path d="M0 110 L50 75 L100 110" stroke="#f59e0b" stroke-width="3" stroke-dasharray="4 4" fill="none"/>
        <path d="M50 10 Q35 75 50 140 Q65 75 50 10 Z" fill="rgba(59, 130, 246, 0.35)" stroke="#2563eb" stroke-width="4"/>

        <line x1="64" y1="64" x2="90" y2="90" stroke="#b45309" stroke-width="12" stroke-linecap="round"/>
        <path d="M25 35 Q35 20 50 25" stroke="#93c5fd" stroke-width="4" stroke-linecap="round" fill="none"/>
      </svg>

      <svg class="deco-item deco-lens-right" viewBox="0 0 100 150">
        <line x1="10" y1="75" x2="90" y2="75" stroke="#d97706" stroke-width="3" stroke-dasharray="5 5"/>
        <circle cx="50" cy="75" r="5" fill="#d97706"/>

          <rect x="45" y="20" width="45" height="65" rx="5" fill="none" stroke="#ffffff" stroke-width="2"/>
        </g>
      </svg>

      <svg class="deco-item deco-star1" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#f59e0b"/></svg>
      <svg class="deco-item deco-star2" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#fbbf24"/></svg>
      <svg class="deco-item deco-star3" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#f59e0b"/></svg>
      <svg class="deco-item deco-star4" viewBox="0 0 40 40"><path d="M20 0 L23 17 L40 20 L23 23 L20 40 L17 23 L0 20 L17 17 Z" fill="#3b82f6"/></svg>

    </div>

    <div class="slide" id="slide2">
      <h3 class="grid-title">CHỌN THẺ CÂU HỎI</h3>
      <div class="card-grid">
        <div class="card-item" onclick="handleCardClick(1, this)">
          <div class="card-inner">
            <div class="card-front card-red">1</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(2, this)">
          <div class="card-inner">
            <div class="card-front card-blue">2</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(3, this)">
          <div class="card-inner">
            <div class="card-front card-green">3</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(4, this)">
          <div class="card-inner">
            <div class="card-front card-yellow">4</div>
            <div class="card-back">ĐÃ LẬT</div>

        </div>
        <div class="card-item" onclick="handleCardClick(5, this)">
          <div class="card-inner">
            <div class="card-front card-orange">5</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(6, this)">
          <div class="card-inner">
            <div class="card-front card-purple">6</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(7, this)">
          <div class="card-inner">
            <div class="card-front card-pink">7</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(8, this)">
          <div class="card-inner">
            <div class="card-front card-white">8</div>
            <div class="card-back">ĐÃ LẬT</div>
          </div>
        </div>
        <div class="card-item" onclick="handleCardClick(9, this)">

      </div>
      <button class="back-btn" onclick="goToSlide(1)">❮ Quay lại</button>
    </div>

    <div class="modal-question" id="modalQ">
      <h3 class="q-title" id="qText">Câu hỏi...</h3>
      <div class="options-grid" id="optionsBox"></div>
      <button class="close-q-btn" onclick="closeQuestion()">Đóng & Quay lại lưới thẻ</button>
    </div>

    <div class="modal-status" id="modalStatus" onclick="closeStatusModal()">
      <div class="status-banner" id="statusBanner">
        <span class="status-icon-box" id="statusIcon"></span>
        <span id="statusText">Trả lời đúng</span>

  </div>

  <script>
    const questionsData = {
      1: {
        title: "Câu 1: Thấu kính là một khối như thế nào?",
        options: [
          "A. Đục, đồng chất",

          "B. Thấu kính phân kỳ có phần rìa dày hơn phần ở giữa",

          "D. Thấu kính hội tụ có phần rìa dày hơn phần ở giữa"
        ],
        correct: 3
      },
      4: {
        title: "Câu 4: Đường thẳng đi qua quang tâm O và vuông góc với tiết diện thẳng của thấu kính gọi là gì?",
        options: [
          "A. Tiêu cự",
          "B. Quang tâm",
          "C. Tiêu điểm chính",

        ],
        correct: 3
      },
      5: {
        title: "Câu 5: Có 1 điểm O của thấu kính mà mọi tia sáng tới O đều truyền thẳng qua thấu kính. Điểm O gọi là gì?",
        options: [
          "A. Quang tâm",
          "B. Tiêu điểm chính",
          "C. Trục chính",
          "D. Tiêu cự"
        ],
        correct: 0
      },
      6: {
        title: "Câu 6: Hình 8.4 mô tả hệ thống thấu kính trong ống kính của một máy ảnh. Thấu kính hội tụ trong hệ thống này là:",
        options: [
          "A. Hình 1 và 3",

          "C. Hình 4 và 2",
          "D. Hình 1 và 4"
        ],
        correct: 0
      },
      7: {
        title: "Câu 7: Đâu là phát biểu sai?",
        options: [
          "A. Tia sáng qua quang tâm của thấu kính thì truyền thẳng",
          "B. Tia tới song song với trục chính của thấu kính hội tụ cho tia ló truyền qua tiêu điểm chính của thấu kính",
          "C. Tia tới song song với trục chính của thấu kính phân kì cho tia ló có đường kéo dài qua tiêu điểm chính của thấu kính",
          "D. Tia tới song song với trục chính của thấu kính thì truyền thẳng"
        ],
        correct: 3
      },
      8: {
        title: "Câu 8: Chiếu một chùm tia sáng song song tới thấu kính hội tụ, chùm tia ló thu được là chùm:",
        options: [
          "A. hội tụ",
          "B. song song",
          "C. phân kì",
          "D. sáng hội tụ tại quang tâm của thấu kính"
        ],
        correct: 0
      },
      9: {
        title: "Câu 9: Khoảng cách từ quang tâm O đến tiêu điểm chính F của thấu kính được gọi là gì?",
        options: [
          "A. Trục chính",
          "B. Tiêu cự",
          "C. Độ tụ",
          "D. Tiêu diện"
        ],
        correct: 1
      },
      10: {
        title: "Câu 10: Chiếu một chùm tia sáng song song với trục chính tới thấu kính phân kỳ thì chùm tia ló có đặc điểm gì?",
        options: [
          "A. Hội tụ tại tiêu điểm chính",
          "B. Song song với trục chính",
          "C. Phân kỳ và có đường kéo dài đi qua tiêu điểm chính",
          "D. Truyền thẳng không bị lệch hướng"
        ],
        correct: 2
      }
    };

    let currentCardElement = null;

    function goToSlide(slideNumber) {
      document.querySelectorAll('.slide').forEach(slide => slide.classList.remove('active'));
      const targetSlide = document.getElementById('slide' + slideNumber);
      if (targetSlide) {
        targetSlide.classList.add('active');
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      const btnPlay = document.getElementById('btnStartGame');
      if (btnPlay) {
        btnPlay.addEventListener('click', () => {
          goToSlide(2);
        });
      }
    });

    function handleCardClick(cardNum, cardEl) {
      if (cardEl.classList.contains('flipped')) {
        showAlreadyAnsweredModal();
        return;
      }
      
      currentCardElement = cardEl;
      const qData = questionsData[cardNum];
      document.getElementById('qText').innerText = qData.title;
      const optionsBox = document.getElementById('optionsBox');
      optionsBox.innerHTML = '';
      
      qData.options.forEach((opt, idx) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.innerText = opt;
        btn.onclick = () => checkAnswer(idx === qData.correct);
        optionsBox.appendChild(btn);
      });

      document.getElementById('modalQ').classList.add('active');
    }

    function closeQuestion() {
      document.getElementById('modalQ').classList.remove('active');
    }

    function checkAnswer(isCorrect) {
      if (currentCardElement) {
        currentCardElement.classList.add('flipped');
      }

      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');
      const icon = document.getElementById('statusIcon');

      if (isCorrect) {
        banner.className = 'status-banner success';
        text.innerText = 'Trả lời đúng';
        /* Icon tích xanh chuẩn SVG */
        icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`;
      } else {
        banner.className = 'status-banner error';
        text.innerText = 'Trả lời sai';
        /* Icon Dấu X đỏ chuẩn SVG - không bị méo/mất nét */
        icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`;
      }

      document.getElementById('modalStatus').classList.add('active');
    }

    function showAlreadyAnsweredModal() {
      const banner = document.getElementById('statusBanner');
      const text = document.getElementById('statusText');
      const icon = document.getElementById('statusIcon');

      banner.className = 'status-banner info';
      text.innerText = 'Bạn đã trả lời rồi!';
      /* Icon thông tin i chuẩn SVG */
      icon.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>`;

      document.getElementById('modalStatus').classList.add('active');
    }

    function closeStatusModal() {
      document.getElementById('modalStatus').classList.remove('active');
      closeQuestion();
    }
  </script>

</body>
</html>
